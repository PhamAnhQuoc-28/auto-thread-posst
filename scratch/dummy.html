<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang Web Mẫu</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    #feed { max-width: 600px; margin: auto; }
    .post-item { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .post-text { font-size: 15px; color: #050505; margin-bottom: 10px; }
    .post-image { max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="feed">
    <div class="post-item">
      <div class="post-text">Đây là nội dung bài đăng mẫu số 1. Nó có thể dài hoặc ngắn.</div>
      <img class="post-image" src="https://via.placeholder.com/400x200.png?text=Hinh+Anh+1" alt="Ảnh 1" />
    </div>
    <div class="post-item">
      <div class="post-text">Đây là nội dung bài đăng mẫu số 2. Bài này không có ảnh.</div>
    </div>
    <div class="post-item">
      <div class="post-text">Bài đăng mẫu số 3 với hình ảnh sản phẩm.</div>
      <img class="post-image" src="https://via.placeholder.com/400x200.png?text=Hinh+Anh+3" alt="Ảnh 3" />
    </div>
  </div>
</body>
</html>
